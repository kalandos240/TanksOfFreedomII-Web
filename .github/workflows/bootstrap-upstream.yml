name: Bootstrap upstream source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-upstream.yml
      - tools/apply_web_port.py
      - tools/apply_web_runtime_fixes.py
      - tools/apply_web_touch_fixes.py
      - tools/apply_yandex_port.py
      - tools/apply_ru_localization.py
      - tools/apply_web_size_optimizations.py
      - tools/package_yandex_web.py
  workflow_dispatch:

concurrency:
  group: tanks-of-freedom-ii-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'kalandos240/TanksOfFreedomII-Web'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pinned Tanks of Freedom II source
        env:
          UPSTREAM_REPO: https://github.com/P1X-in/tanks-of-freedom-ii.git
          UPSTREAM_SHA: dbe629ea05691599dde4fd65ab9a13b78a4ccfe1
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          git clone --filter=blob:none "$UPSTREAM_REPO" "$tmp_dir/upstream"
          git -C "$tmp_dir/upstream" checkout --detach "$UPSTREAM_SHA"

          # Runtime source only. docs/ contains proprietary marketing assets
          # and is not required for the game build.
          rsync -a \
            --exclude='.git/' \
            --exclude='docs/' \
            "$tmp_dir/upstream/" ./

          printf '%s\n' "$UPSTREAM_SHA" > UPSTREAM_COMMIT

      - name: Apply Web Portal and Yandex Games patches
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/apply_web_port.py \
            tools/apply_web_runtime_fixes.py \
            tools/apply_web_touch_fixes.py \
            tools/apply_yandex_port.py \
            tools/apply_ru_localization.py \
            tools/apply_web_size_optimizations.py \
            tools/package_yandex_web.py \
            tools/check_localization.py
          python3 tools/apply_web_port.py
          python3 tools/apply_web_runtime_fixes.py
          python3 tools/apply_web_touch_fixes.py
          python3 tools/apply_yandex_port.py
          python3 tools/apply_ru_localization.py
          python3 tools/apply_web_size_optimizations.py

          # The entire core/common UI is already release-gated in all three
          # languages. Campaign RU overlays are authored and promoted in stages.
          python3 tools/check_localization.py \
            --required-csv en pl ru \
            --required-campaigns en pl

      - name: Commit imported and patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to import or patch."
            exit 0
          fi

          git commit -m "Import upstream and apply Web Portal v1"

          # Connector/user commits may land while the relatively long upstream
          # import is running. Rebase the deterministic patch commit instead of
          # failing with a non-fast-forward push.
          git pull --rebase origin main
          git push origin HEAD:main
