name: Browser Smoke Test

on:
  workflow_run:
    workflows: ["Build Web Portal"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Web Portal run ID
        required: true
        type: string
      build_run_number:
        description: Successful Build Web Portal run number
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: tanks-of-freedom-ii-browser-smoke-${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Download Web build artifact
        uses: actions/download-artifact@v4
        with:
          name: TanksOfFreedomII-Web-v1-${{ github.event_name == 'workflow_dispatch' && inputs.build_run_number || github.event.workflow_run.run_number }}
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}

      - name: Locate exported Web build
        shell: bash
        run: |
          set -euo pipefail
          test -s artifact/build/web/index.html
          test -s artifact/build/web/index.js
          test -s artifact/build/web/index.wasmz
          test -s artifact/build/web/index.pckz
          find artifact/build/web -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort

      - name: Install local Yandex SDK stub
        shell: bash
        run: |
          set -euo pipefail
          cat > artifact/build/web/sdk.js <<'JS'
          (function () {
            const html = document.documentElement;
            const handlers = Object.create(null);

            function mark(name) {
              html.setAttribute(name, "1");
            }

            window.YaGames = {
              init: function () {
                mark("data-tof-sdk-init");
                return Promise.resolve({
                  environment: { i18n: { lang: "ru" } },
                  features: {
                    LoadingAPI: {
                      ready: function () {
                        mark("data-tof-ready");
                      }
                    }
                  },
                  on: function (name, callback) {
                    handlers[name] = callback;
                    html.setAttribute("data-tof-subscribed-" + name.replace(/_/g, "-"), "1");

                    if (name === "game_api_pause") {
                      setTimeout(function () {
                        mark("data-tof-pause-fired");
                        callback();
                      }, 5000);
                    }
                    if (name === "game_api_resume") {
                      setTimeout(function () {
                        mark("data-tof-resume-fired");
                        callback();
                      }, 8000);
                    }
                  }
                });
              }
            };
          })();
          JS
          node --check artifact/build/web/sdk.js

      - name: Prepare browser probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet websocket-client

          cat > browser_probe.py <<'PY'
          import json
          import sys
          import time
          import urllib.request

          import websocket

          CDP_URL = "http://127.0.0.1:9222/json"
          PAGE_URL_FRAGMENT = "127.0.0.1:8765/index.html"
          EVENTS_PATH = "smoke-cdp-events.jsonl"
          STATE_PATH = "smoke-state.json"

          events = []
          next_id = 1


          def save_event(message):
              method = message.get("method", "")
              if method in {
                  "Runtime.exceptionThrown",
                  "Runtime.consoleAPICalled",
                  "Log.entryAdded",
              }:
                  events.append(message)
                  with open(EVENTS_PATH, "a", encoding="utf-8") as handle:
                      handle.write(json.dumps(message, ensure_ascii=False) + "\n")


          deadline = time.time() + 45
          page = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(CDP_URL, timeout=1) as response:
                      pages = json.load(response)
                  page = next(
                      (
                          item
                          for item in pages
                          if item.get("type") == "page"
                          and PAGE_URL_FRAGMENT in item.get("url", "")
                      ),
                      None,
                  )
                  if page is not None:
                      break
              except Exception:
                  pass
              time.sleep(0.5)

          if page is None:
              raise SystemExit("Chrome DevTools page did not become available")

          ws = websocket.create_connection(
              page["webSocketDebuggerUrl"],
              timeout=2,
          )


          def command(method, params=None):
              global next_id
              request_id = next_id
              next_id += 1
              ws.send(
                  json.dumps(
                      {
                          "id": request_id,
                          "method": method,
                          "params": params or {},
                      }
                  )
              )
              response_deadline = time.time() + 10
              while time.time() < response_deadline:
                  try:
                      message = json.loads(ws.recv())
                  except websocket.WebSocketTimeoutException:
                      continue
                  save_event(message)
                  if message.get("id") == request_id:
                      return message
              raise TimeoutError(method)


          command("Runtime.enable")
          command("Log.enable")

          expression = r'''(() => {
            const html = document.documentElement;
            let webgl2 = false;
            try {
              webgl2 = !!document.createElement("canvas").getContext("webgl2");
            } catch (_) {}
            const state = window.tofYandex || null;
            return {
              sdkInit: html.getAttribute("data-tof-sdk-init"),
              pauseSubscribed: html.getAttribute("data-tof-subscribed-game-api-pause"),
              resumeSubscribed: html.getAttribute("data-tof-subscribed-game-api-resume"),
              pauseFired: html.getAttribute("data-tof-pause-fired"),
              resumeFired: html.getAttribute("data-tof-resume-fired"),
              ready: html.getAttribute("data-tof-ready"),
              webgl2,
              yandex: state ? {
                initialized: !!state.initialized,
                failed: !!state.failed,
                lang: state.lang || "",
                gameReadySent: !!state.gameReadySent,
                platformPaused: !!state.platformPaused,
                godotPauseApplied: Object.prototype.hasOwnProperty.call(state, "godotPauseApplied") ? state.godotPauseApplied : null,
                godotTreePausedAfterPause: Object.prototype.hasOwnProperty.call(state, "godotTreePausedAfterPause") ? state.godotTreePausedAfterPause : null,
                godotResumeApplied: Object.prototype.hasOwnProperty.call(state, "godotResumeApplied") ? state.godotResumeApplied : null,
                godotTreePausedAfterResume: Object.prototype.hasOwnProperty.call(state, "godotTreePausedAfterResume") ? state.godotTreePausedAfterResume : null
              } : null,
              title: document.title
            };
          })()'''

          state = None
          deadline = time.time() + 100
          while time.time() < deadline:
              result = command(
                  "Runtime.evaluate",
                  {
                      "expression": expression,
                      "returnByValue": True,
                      "awaitPromise": True,
                  },
              )
              state = (
                  result.get("result", {})
                  .get("result", {})
                  .get("value")
              )
              if state is not None:
                  with open(STATE_PATH, "w", encoding="utf-8") as handle:
                      json.dump(state, handle, ensure_ascii=False, indent=2)
                  print(json.dumps(state, ensure_ascii=False, sort_keys=True), flush=True)

                  yandex = state.get("yandex") or {}
                  if (
                      state.get("ready") == "1"
                      and state.get("pauseFired") == "1"
                      and state.get("resumeFired") == "1"
                      and yandex.get("godotPauseApplied") is True
                      and yandex.get("godotTreePausedAfterPause") is True
                      and yandex.get("godotResumeApplied") is True
                      and yandex.get("godotTreePausedAfterResume") is False
                  ):
                      break
              time.sleep(1)

          ws.close()

          if not state:
              raise SystemExit("No browser state was returned")

          required = {
              "sdkInit": "1",
              "pauseSubscribed": "1",
              "resumeSubscribed": "1",
              "pauseFired": "1",
              "resumeFired": "1",
              "ready": "1",
              "webgl2": True,
          }
          failures = {
              key: (state.get(key), expected)
              for key, expected in required.items()
              if state.get(key) != expected
          }
          yandex = state.get("yandex") or {}
          if yandex.get("initialized") is not True:
              failures["yandex.initialized"] = (yandex.get("initialized"), True)
          if yandex.get("failed") is not False:
              failures["yandex.failed"] = (yandex.get("failed"), False)
          if yandex.get("lang") != "ru":
              failures["yandex.lang"] = (yandex.get("lang"), "ru")
          if yandex.get("gameReadySent") is not True:
              failures["yandex.gameReadySent"] = (yandex.get("gameReadySent"), True)
          if yandex.get("platformPaused") is not False:
              failures["yandex.platformPaused"] = (yandex.get("platformPaused"), False)
          if yandex.get("godotPauseApplied") is not True:
              failures["yandex.godotPauseApplied"] = (yandex.get("godotPauseApplied"), True)
          if yandex.get("godotTreePausedAfterPause") is not True:
              failures["yandex.godotTreePausedAfterPause"] = (yandex.get("godotTreePausedAfterPause"), True)
          if yandex.get("godotResumeApplied") is not True:
              failures["yandex.godotResumeApplied"] = (yandex.get("godotResumeApplied"), True)
          if yandex.get("godotTreePausedAfterResume") is not False:
              failures["yandex.godotTreePausedAfterResume"] = (yandex.get("godotTreePausedAfterResume"), False)

          hard_events = []
          for event in events:
              method = event.get("method")
              params = event.get("params", {})
              if method == "Runtime.exceptionThrown":
                  hard_events.append(event)
              elif method == "Log.entryAdded":
                  level = (params.get("entry") or {}).get("level")
                  if level == "error":
                      hard_events.append(event)

          if hard_events:
              failures["browserErrors"] = (len(hard_events), 0)

          if failures:
              print("Browser smoke failures:", file=sys.stderr)
              print(json.dumps(failures, ensure_ascii=False, indent=2), file=sys.stderr)
              raise SystemExit(1)

          print("Browser smoke confirmed Yandex SDK -> JS -> Godot SceneTree pause/resume round trip.")
          PY

      - name: Start local Web server
        shell: bash
        run: |
          set -euo pipefail
          cd artifact/build/web
          python3 -m http.server 8765 --bind 127.0.0.1 > "$GITHUB_WORKSPACE/http-server.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/http-server.pid"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Local Web server did not become ready."
          exit 1

      - name: Run Web build in Chromium and probe with CDP
        shell: bash
        run: |
          set -euo pipefail

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chromium-based browser found on the GitHub runner."
            exit 1
          fi
          echo "Browser: $chrome"
          "$chrome" --version | tee browser-version.txt

          rm -rf "$RUNNER_TEMP/tof-browser-profile"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --enable-unsafe-swiftshader \
            --ignore-gpu-blocklist \
            --use-gl=angle \
            --use-angle=swiftshader \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --user-data-dir="$RUNNER_TEMP/tof-browser-profile" \
            --no-first-run \
            --no-default-browser-check \
            http://127.0.0.1:8765/index.html \
            > smoke-chrome.out 2> smoke-chrome.log &
          echo $! > chrome-launcher.pid

          python3 browser_probe.py | tee smoke-probe.log

      - name: Stop local browser and server
        if: always()
        shell: bash
        run: |
          if [ -f chrome-launcher.pid ]; then
            kill "$(cat chrome-launcher.pid)" 2>/dev/null || true
          fi
          if [ -f http-server.pid ]; then
            kill "$(cat http-server.pid)" 2>/dev/null || true
          fi

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.event_name == 'workflow_dispatch' && inputs.build_run_number || github.event.workflow_run.run_number }}
          path: |
            smoke-state.json
            smoke-cdp-events.jsonl
            smoke-probe.log
            smoke-chrome.log
            smoke-chrome.out
            browser-version.txt
            http-server.log
          if-no-files-found: warn
          retention-days: 14
