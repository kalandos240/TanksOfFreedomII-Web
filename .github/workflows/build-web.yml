name: Build Web Portal

on:
  push:
    branches: [main]
    paths:
      - project.godot
      - export_presets.cfg
      - scripts/**
      - scenes/**
      - assets/**
      - localization/**
      - tools/apply_web_port.py
      - tools/apply_web_runtime_fixes.py
      - tools/apply_yandex_port.py
      - tools/check_localization.py
      - .github/workflows/build-web.yml
  workflow_dispatch:

concurrency:
  group: tanks-of-freedom-ii-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install CI utilities
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 zip unzip

      - name: Validate localization baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_localization.py --required en pl | tee localization-check.txt

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates/
          if [ -d /root/.local/share/godot/export_templates/4.4.stable ]; then
            mv /root/.local/share/godot/export_templates/4.4.stable ~/.local/share/godot/export_templates/4.4.stable
          fi
          godot --version | tee godot-version.txt

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          set +e
          godot --headless --editor --path . --quit 2>&1 | tee import.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > import.status
          exit 0

      - name: Report import diagnostics
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat import.status)"
          echo "Godot project import exit code: $status"
          grep -Ein 'ERROR|SCRIPT ERROR|Parse Error|failed|cannot|invalid|unsupported' import.log | tail -n 120 || true
          echo "=== import log tail ==="
          tail -n 120 import.log || true
          test "$status" -eq 0

      - name: Export Web Portal
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          set +e
          godot --headless --verbose --path . --export-release "Web Portal" build/web/index.html 2>&1 | tee build-web.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > build-web.status
          exit 0

      - name: Report export diagnostics
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat build-web.status)"
          echo "Godot Web export exit code: $status"
          echo "=== key diagnostics ==="
          grep -Ein 'ERROR|SCRIPT ERROR|Parse Error|failed|cannot|invalid|unsupported|WARNING' build-web.log | tail -n 180 || true
          echo "=== export log tail ==="
          tail -n 180 build-web.log || true
          test "$status" -eq 0

      - name: Verify Web export and Yandex archive rules
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee build-sizes.txt
          find build/web -maxdepth 1 -type f -name '*.wasm' -size +0c | grep -q .
          find build/web -maxdepth 1 -type f -name '*.pck' -size +0c | grep -q .

          # Yandex SDK must be embedded through the exported HTML head.
          grep -Fq '<script src="/sdk.js"></script>' build/web/index.html
          grep -Fq 'LoadingAPI' build/web/index.html

          # Yandex Games: unpacked archive must not exceed 100 MiB.
          unpacked_bytes="$(du -sb build/web | cut -f1)"
          echo "Unpacked build: ${unpacked_bytes} bytes" | tee -a build-sizes.txt
          test "$unpacked_bytes" -le 104857600

          # Yandex Games: no spaces or Cyrillic characters in archive paths.
          bad_paths="$(find build/web -mindepth 1 -printf '%P\n' | grep -E ' |[А-Яа-яЁё]' || true)"
          if [ -n "$bad_paths" ]; then
            echo "Invalid Yandex archive paths:"
            printf '%s\n' "$bad_paths"
            exit 1
          fi

      - name: Create portal ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd build/web && zip -9 -r ../TanksOfFreedomII-Web-v1.zip .)
          ls -lh build/TanksOfFreedomII-Web-v1.zip

          # index.html must be at the archive root.
          unzip -Z1 build/TanksOfFreedomII-Web-v1.zip | grep -qx 'index.html'

      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TanksOfFreedomII-Web-v1-${{ github.run_number }}
          path: |
            build/TanksOfFreedomII-Web-v1.zip
            build/web/
            build-sizes.txt
            build-web.log
            build-web.status
            import.log
            import.status
            localization-check.txt
            godot-version.txt
          if-no-files-found: warn
          retention-days: 14
