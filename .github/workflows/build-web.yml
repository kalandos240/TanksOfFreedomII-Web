name: Build Web Portal

on:
  push:
    branches: [main]
    paths:
      - project.godot
      - export_presets.cfg
      - scripts/**
      - scenes/**
      - assets/**
      - localization/**
      - tools/apply_web_port.py
      - tools/apply_web_environment_fixes.py
      - tools/apply_web_font_fixes.py
      - tools/apply_web_runtime_fixes.py
      - tools/apply_web_touch_fixes.py
      - tools/apply_web_ui_hardening.py
      - tools/apply_web_gameplay_performance_fixes.py
      - tools/apply_web_visual_fixes.py
      - tools/apply_yandex_port.py
      - tools/apply_ru_localization.py
      - tools/apply_web_size_optimizations.py
      - tools/package_yandex_web.py
      - tools/check_localization.py
      - .github/workflows/build-web.yml
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:

concurrency:
  group: tanks-of-freedom-ii-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  web-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install CI utilities
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 zip unzip nodejs curl fonts-noto-core

      - name: Apply native Web touch controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_web_touch_fixes.py
          python3 tools/apply_web_touch_fixes.py | tee touch-fixes.txt

      - name: Apply Russian localization runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_ru_localization.py
          python3 tools/apply_ru_localization.py | tee ru-localization-runtime.txt

          test -s scripts/services/ru_translation_loader.gd
          grep -Fq 'RuTranslationLoader="*res://scripts/services/ru_translation_loader.gd"' project.godot
          ! grep -Fq 'common.ru.ru.translation' project.godot
          ! grep -Fq 'core.ru.ru.translation' project.godot
          grep -Fq 'assets/translations/*.ru.csv' export_presets.cfg

      - name: Apply embedded Cyrillic Web font
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_web_font_fixes.py
          python3 tools/apply_web_font_fixes.py | tee web-font-fixes.txt

          test -s assets/fonts/ttf/tof_web_cyrillic.ttf
          grep -Fq 'tof_web_cyrillic.ttf' assets/fonts/courier.tres

      - name: Apply original Web environment mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_web_environment_fixes.py
          python3 tools/apply_web_environment_fixes.py | tee web-environment-fixes.txt

      - name: Apply Web runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/apply_web_runtime_fixes.py
          python3 tools/apply_web_runtime_fixes.py | tee web-runtime-fixes.txt

      - name: Apply Web size optimization profile
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_web_size_optimizations.py | tee size-optimization.txt

      - name: Validate localization baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_localization.py \
            --required-csv en pl ru \
            --required-campaigns en pl \
            | tee localization-check.txt

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates/
          if [ -d /root/.local/share/godot/export_templates/4.4.stable ]; then
            mv /root/.local/share/godot/export_templates/4.4.stable ~/.local/share/godot/export_templates/4.4.stable
          fi
          godot --version | tee godot-version.txt

      - name: Prepare original HDR losslessly for Web
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee web-hdr-import.txt
          import re
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root / "assets/kloppenheim_03_4k.hdr"
          if not source.is_file() or source.stat().st_size == 0:
              raise SystemExit("Original Kloppenheim HDR source is missing")

          # Import the exact original HDR in an isolated one-file Godot project.
          # This avoids the upstream BPTC-only cache remap, which WebGL cannot
          # load, without changing a single source pixel or environment value.
          with tempfile.TemporaryDirectory(prefix="tof-hdr-") as tmp_name:
              tmp = Path(tmp_name)
              (tmp / "project.godot").write_text(
                  'config_version=5\n\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n',
                  encoding="utf-8",
              )
              isolated_source = tmp / "original.hdr"
              shutil.copy2(source, isolated_source)

              proc = subprocess.run(
                  ["godot", "--headless", "--editor", "--path", str(tmp), "--import"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=120,
              )
              print(proc.stdout)
              if proc.returncode != 0:
                  raise SystemExit(f"Isolated HDR import failed with exit code {proc.returncode}")

              import_meta = tmp / "original.hdr.import"
              if not import_meta.is_file():
                  raise SystemExit("Godot did not generate HDR import metadata")
              meta = import_meta.read_text(encoding="utf-8")
              if "compress/mode=0" not in meta:
                  raise SystemExit("Isolated HDR was not imported losslessly")

              imported = list((tmp / ".godot/imported").glob("original.hdr-*.ctex"))
              imported = [p for p in imported if not p.name.endswith(".editor.ctex")]
              if len(imported) != 1:
                  raise SystemExit(f"Expected one lossless HDR ctex, got: {imported}")

              target_stem = "kloppenheim_03_4k.hdr-9393188a22828feb8b70131e4dd3d668"
              target_dir = root / ".godot/imported"
              target_dir.mkdir(parents=True, exist_ok=True)
              target_ctex = target_dir / f"{target_stem}.ctex"
              shutil.copy2(imported[0], target_ctex)

              source_md5 = imported[0].with_suffix(".md5")
              if source_md5.is_file():
                  shutil.copy2(source_md5, target_dir / f"{target_stem}.md5")

              target_res = f"res://.godot/imported/{target_stem}.ctex"
              meta = re.sub(r'^uid="[^"]+"$', 'uid="uid://bieopmsruclpo"', meta, flags=re.M)
              meta = re.sub(r'^path(?:\.[^=]+)?="[^"]+"$', f'path="{target_res}"', meta, flags=re.M)
              meta = re.sub(r'^source_file="[^"]+"$', 'source_file="res://assets/kloppenheim_03_4k.hdr"', meta, flags=re.M)
              meta = re.sub(r'^dest_files=\[[^\n]*\]$', f'dest_files=["{target_res}"]', meta, flags=re.M)
              meta = re.sub(r'^detect_3d/compress_to=\d+$', 'detect_3d/compress_to=0', meta, flags=re.M)
              meta = re.sub(r'^compress/mode=\d+$', 'compress/mode=0', meta, flags=re.M)
              meta = meta.replace('"vram_texture": true', '"vram_texture": false')
              meta = re.sub(r'^"imported_formats": \[[^\n]*\],?\n', '', meta, flags=re.M)

              target_meta = root / "assets/kloppenheim_03_4k.hdr.import"
              target_meta.write_text(meta, encoding="utf-8", newline="\n")

              if ".bptc.ctex" in meta or ".astc.ctex" in meta:
                  raise SystemExit("Desktop/mobile VRAM HDR remap survived lossless preparation")
              if target_res not in meta or not target_ctex.is_file():
                  raise SystemExit("Lossless HDR remap was not prepared correctly")

              print(f"Prepared original HDR losslessly: {target_ctex} ({target_ctex.stat().st_size} bytes)")
          PY

          grep -Fq 'compress/mode=0' assets/kloppenheim_03_4k.hdr.import
          grep -Fq 'path="res://.godot/imported/kloppenheim_03_4k.hdr-9393188a22828feb8b70131e4dd3d668.ctex"' assets/kloppenheim_03_4k.hdr.import
          test -s .godot/imported/kloppenheim_03_4k.hdr-9393188a22828feb8b70131e4dd3d668.ctex

      - name: Warm project cache
        shell: bash
        run: |
          set -o pipefail
          set +e
          # A bounded editor start has proven reliable for this project in Godot
          # 4.4 CI. Full --import can stall indefinitely in the full project.
          godot --headless --editor --path . --quit 2>&1 | tee import-warmup.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > import-warmup.status

          echo "Godot cache warm-up exit code: $status"
          grep -Ein 'ERROR|SCRIPT ERROR|Parse Error|failed|cannot|invalid|unsupported' import-warmup.log | tail -n 120 || true
          tail -n 100 import-warmup.log || true
          test "$status" -eq 0

          unexpected_errors="$(
            grep -E '^ERROR:|SCRIPT ERROR:|Parse Error:' import-warmup.log \
              | grep -Ev 'progress dialog \(task\)|!tasks\.has\(p_task\)' \
              || true
          )"
          if [ -n "$unexpected_errors" ]; then
            echo "Unexpected Godot errors during cache warm-up:"
            printf '%s\n' "$unexpected_errors"
            exit 1
          fi

      - name: Export Web Portal
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          set +e
          godot --headless --verbose --path . --export-release "Web Portal" build/web/index.html 2>&1 | tee build-web.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > build-web.status
          exit 0

      - name: Report export diagnostics
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat build-web.status)"
          echo "Godot Web export exit code: $status"
          echo "=== key diagnostics ==="
          grep -Ein 'ERROR|SCRIPT ERROR|Parse Error|failed|cannot|invalid|unsupported|WARNING' build-web.log | tail -n 180 || true
          echo "=== export log tail ==="
          tail -n 180 build-web.log || true

          test "$status" -eq 0
          if grep -Eq '^ERROR:|SCRIPT ERROR:|Parse Error:' build-web.log; then
            echo "Godot Web export emitted a hard error despite exit code 0."
            exit 1
          fi

      - name: Package compressed Yandex payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/package_yandex_web.py
          python3 tools/package_yandex_web.py build/web | tee yandex-package.txt

          python3 - <<'PY' > compressed-loader.js
          from pathlib import Path
          html = Path('build/web/index.html').read_text(encoding='utf-8')
          tag = '<script data-tof-compressed-loader="1">'
          start = html.index(tag) + len(tag)
          end = html.index('</script>', start)
          print(html[start:end])
          PY
          node --check compressed-loader.js

      - name: Verify Web export and Yandex archive rules
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasmz
          test -s build/web/index.pckz
          test ! -e build/web/index.wasm
          test ! -e build/web/index.pck

          find build/web -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee build-sizes.txt

          grep -Fq '<script src="/sdk.js"></script>' build/web/index.html
          grep -Fq 'LoadingAPI' build/web/index.html
          grep -Fq 'data-tof-compressed-loader="1"' build/web/index.html
          grep -Fq 'DecompressionStream' build/web/index.html

          unpacked_bytes="$(find build/web -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')"
          echo "Unpacked file bytes: ${unpacked_bytes}" | tee -a build-sizes.txt
          test "$unpacked_bytes" -le 100000000

          bad_paths="$(find build/web -mindepth 1 -printf '%P\n' | grep -E ' |[А-Яа-яЁё]' || true)"
          if [ -n "$bad_paths" ]; then
            echo "Invalid Yandex archive paths:"
            printf '%s\n' "$bad_paths"
            exit 1
          fi

      - name: Create portal ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd build/web && zip -9 -r ../TanksOfFreedomII-Web-v1.zip .)
          ls -lh build/TanksOfFreedomII-Web-v1.zip

          unzip -Z1 build/TanksOfFreedomII-Web-v1.zip | grep -qx 'index.html'
          test "$(stat -c '%s' build/TanksOfFreedomII-Web-v1.zip)" -le 100000000

      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TanksOfFreedomII-Web-v1-${{ github.run_number }}
          path: |
            build/TanksOfFreedomII-Web-v1.zip
            build/web/
            build-sizes.txt
            touch-fixes.txt
            ru-localization-runtime.txt
            web-font-fixes.txt
            web-environment-fixes.txt
            web-runtime-fixes.txt
            web-hdr-import.txt
            size-optimization.txt
            yandex-package.txt
            compressed-loader.js
            build-web.log
            build-web.status
            import-warmup.log
            import-warmup.status
            localization-check.txt
            godot-version.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Dispatch browser smoke for this artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/browser-smoke.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"build_run_id\":\"${GITHUB_RUN_ID}\",\"build_run_number\":\"${GITHUB_RUN_NUMBER}\"}}"
